name: Docker

on:
  push:
    branches: ["main"]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        CMAKE_BUILD_TYPE: [RelWithDebInfo, Debug]
        compiler: [{CXX: g++-15, CC: gcc-15}, {CXX: clang++-19, CC: clang-19}]

    runs-on: ubuntu-26.04-32

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h /

      - name: Reserve hugepages
        run: |
          hugepages=/sys/devices/system/node/node0/hugepages
          echo 2048 | sudo tee $hugepages/hugepages-2048kB/nr_hugepages
          echo 8 | sudo tee $hugepages/hugepages-1048576kB/nr_hugepages
          cat $hugepages/hugepages-*/nr_hugepages

      - name: Check out submodules
        run: |
          git config --global submodule.LegacyTests.update none
          git config --global submodule.third_party/tests.update none
          git submodule update --init --recursive --depth=1 --jobs "$(nproc)"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build `build_and_test` stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: |-
            CC=${{ matrix.compiler.CC }}
            CXX=${{ matrix.compiler.CXX }}
            CMAKE_BUILD_TYPE=${{ matrix.CMAKE_BUILD_TYPE }}
            TOOLCHAIN=gcc-avx2
            UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/
          secrets: |
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
            actions_cache_service_v2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
          allow: security.insecure # for tests which use io_uring
          ulimit: "memlock=-1:-1"
          target: build_and_test
          cache-from: |
            type=gha,scope=bat-${{ matrix.compiler.CC }}-${{ matrix.CMAKE_BUILD_TYPE }}
            type=gha,scope=test_fixtures
          cache-to: type=gha,scope=bat-${{ matrix.compiler.CC }}-${{ matrix.CMAKE_BUILD_TYPE }},mode=max
